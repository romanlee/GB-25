name: Container

on:
  push:
    paths:
      - 'Project.toml'
      - 'src/**'
      - 'sharding/**'
      - 'simulations/**'
      - 'container/**'
      - '.github/workflows/Container.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build linux/${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push digest (linux/${{ matrix.arch }})
        env:
          REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          export REGISTRY_IMAGE="${REGISTRY_IMAGE,,}"
          ./container/build.sh \
            --set "*.platform=linux/${{ matrix.arch }}" \
            --set "*.output=type=image,name=${REGISTRY_IMAGE},push-by-digest=true,push=true" \
            --metadata-file "/tmp/metadata-${{ matrix.arch }}.json"
          jq -r '.["default"]["containerimage.digest"]' "/tmp/metadata-${{ matrix.arch }}.json" > "/tmp/digest-${{ matrix.arch }}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digest-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch image
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        env:
          REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          IMAGE="${REGISTRY_IMAGE,,}"
          DIGEST_AMD64="$(cat /tmp/digests/digest-amd64)"
          DIGEST_ARM64="$(cat /tmp/digests/digest-arm64)"
          docker buildx imagetools create -t "${IMAGE}" \
            "${IMAGE}@${DIGEST_AMD64}" \
            "${IMAGE}@${DIGEST_ARM64}"
